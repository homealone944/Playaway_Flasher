name: Build and Release Calibre Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Calibre Plugin Zip
        run: |
          python calibre_plugin/build_plugin.py

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Calibre_Playaway_Flasher.zip
          name: Playaway Flasher ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
